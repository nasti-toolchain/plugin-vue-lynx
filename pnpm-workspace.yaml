packages:
  - examples/*
allowBuilds:
  '@swc/core': true
  core-js: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@nasti-toolchain/nasti@2.4.0 || 2.4.2'
  - '@rolldown/binding-android-arm64@1.2.1'
  - '@rolldown/binding-darwin-arm64@1.2.1'
  - '@rolldown/binding-darwin-x64@1.2.1'
  - '@rolldown/binding-freebsd-x64@1.2.1'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.1'
  - '@rolldown/binding-linux-arm64-gnu@1.2.1'
  - '@rolldown/binding-linux-arm64-musl@1.2.1'
  - '@rolldown/binding-linux-ppc64-gnu@1.2.1'
  - '@rolldown/binding-linux-s390x-gnu@1.2.1'
  - '@rolldown/binding-linux-x64-gnu@1.2.1'
  - '@rolldown/binding-linux-x64-musl@1.2.1'
  - '@rolldown/binding-openharmony-arm64@1.2.1'
  - '@rolldown/binding-wasm32-wasi@1.2.1'
  - '@rolldown/binding-win32-arm64-msvc@1.2.1'
  - '@rolldown/binding-win32-x64-msvc@1.2.1'
  - rolldown@1.2.1
peerDependencyRules:
  allowedVersions:
    # Optional WASI fallbacks are resolved through both the Rspeedy (emnapi 1)
    # and Nasti 2.4 (emnapi 2 alpha) toolchains. Native platform bindings are
    # used in CI and production; keep pnpm's all-platform peer audit explicit.
    '@napi-rs/wasm-runtime@1.2.0>@emnapi/core': ^1.9.1 || ^2.0.0-alpha.3
    '@napi-rs/wasm-runtime@1.2.0>@emnapi/runtime': ^1.9.1 || ^2.0.0-alpha.3
overrides:
  '@lynx-js/css-extract-webpack-plugin': 0.7.0
